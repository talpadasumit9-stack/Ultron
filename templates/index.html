<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Ultron System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-red" id="body-theme">

    <div id="lock-screen" class="screen active">
        <h2>RESTRICTED ACCESS</h2>
        <p>Identify yourself.</p>
        <input type="password" id="passcode" placeholder="Enter Access Code">
        <button onclick="checkCode()">AUTHORIZE</button>
        <p id="lock-error"></p>
    </div>

    <div id="main-ui" class="screen">
        
        <div class="hologram-container">
            <div class="core-ring ring-1"></div>
            <div class="core-ring ring-2"></div>
            <div class="core-ring ring-3"></div>
            <div class="core-center"></div>
        </div>

        <h1 class="title" id="system-title">ULTRON OS</h1>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="controls">
            <button id="mic-btn" class="glowing-btn">🎙️ INITIATE COMMAND</button>
        </div>
        <p id="status-text">System Standby...</p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
